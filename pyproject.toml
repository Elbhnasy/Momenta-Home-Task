[project]
name = "voice-screener"
version = "0.1.0"
description = "Voice agent that screens one .NET question, decides whether to probe once, and speaks a scored evaluation in the candidate's language."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.60.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langgraph>=1.2.10",
    "numpy>=2.4.6",
    "openai>=2.52.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.0",
]

# Application, not a library: no build backend, no src-layout package.
# Modules live in app/ and are imported from the project root.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
